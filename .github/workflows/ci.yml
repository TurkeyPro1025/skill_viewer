name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 语法护栏:覆盖测试不会加载的 site/app.js、site/demo.js 等脚本
      - run: npm run check
      # fixture 技能树 + stub provider:无任何 API key 环境下全绿
      - run: npm test
